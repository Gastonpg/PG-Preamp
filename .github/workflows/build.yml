name: Build PG Preamp VST3

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout PG Preamp
        uses: actions/checkout@v4

      - name: Get Steinberg VST3 SDK
        shell: pwsh
        run: git clone --depth 1 --recurse-submodules https://github.com/steinbergmedia/vst3sdk.git external/vst3sdk

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_CREATE_PLUGIN_LINK=0

      - name: Compile
        run: cmake --build build --config Release --target PGPreamp

      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if (-not $plugin) {
            Write-Error "No se encontró el paquete .vst3 después de compilar."
            exit 1
          }
          Compress-Archive -Path $plugin.FullName -DestinationPath "$PWD/PG-Preamp-Windows-x64.zip" -Force

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: PG-Preamp-Windows-x64
          path: PG-Preamp-Windows-x64.zip
          if-no-files-found: error
